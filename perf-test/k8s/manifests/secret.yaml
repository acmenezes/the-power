# secret.yaml — GHES credentials for the performance test runner.
#
# Create the secret manually (don't commit real tokens):
#
#   kubectl -n ghes-perf-test create secret generic ghes-credentials \
#     --from-literal=token='ghp_YOUR_TOKEN_HERE' \
#     --from-literal=host='192.168.2.251'
#
# Or apply this template after filling in the base64-encoded values:
apiVersion: v1
kind: Secret
metadata:
  name: ghes-credentials
  namespace: ghes-perf-test
  labels:
    app.kubernetes.io/name: ghes-perf-test
type: Opaque
stringData:
  token: "REPLACE_WITH_GHES_TOKEN"
  host: "REPLACE_WITH_GHES_HOST"
