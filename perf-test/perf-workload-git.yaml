# perf-workload-git.yaml — Git-only workload (clone/fetch/push over HTTPS).
#
# Run build-all.sh first to create the org, repo, issues, and branches needed.

target_rpm: 30
duration: 300
workers: 5

scripts:
  - {script: scripts/git-fetch.sh,                   weight: 15}
  - {script: scripts/git-pull.sh,                    weight: 10}
  - {script: scripts/git-clone-repo.sh,              weight: 10}
  - {script: scripts/git-clone-and-push.sh,           weight: 5}
