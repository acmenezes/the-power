# perf-workload-git.yaml — Git-only workload (clone/fetch/push over HTTPS).
#
# Run build-all.sh first to create the org, repo, issues, and branches needed.

target_rpm: 30
duration: 300
workers: 5

scripts:
  - {script: perf-test/git-fetch.sh,                 weight: 15}
  - {script: perf-test/git-pull.sh,                  weight: 10}
  - {script: perf-test/git-clone-repo.sh,            weight: 10}
  - {script: perf-test/git-clone-and-push.sh,         weight: 5}
