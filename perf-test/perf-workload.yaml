# perf-workload.yaml — Default balanced workload for GHES performance testing.
#
# Each entry points to a real project script. Add or remove any script you like.
# Weights control how often each script is picked (they don't need to sum to 100).
# Run build-all.sh first to create the org, repo, issues, and branches needed.

target_rpm: 60          # requests per minute (start low, scale up)
duration: 300           # seconds
workers: 5              # concurrent threads

scripts:
  # ── Read operations ────────────────────────────────────────────────────
  - {script: scripts/list-repo.sh,                          weight: 5}
  - {script: scripts/list-repository-issues.sh,              weight: 10}
  - {script: scripts/list-pull-requests.sh,                  weight: 10}
  - {script: scripts/list-org-repos.sh,                       weight: 5}
  - {script: scripts/get-repository-content.sh,              weight: 10}
  - {script: scripts/search-issues-and-pull-requests.sh,      weight: 5}

  # ── Write operations ───────────────────────────────────────────────────
  - {script: scripts/create-an-issue.sh,                     weight: 10}
  - {script: scripts/create-issue-comment.sh,                 weight: 10}
  - {script: scripts/create-branch-and-pr.sh,                 weight: 5}

  # ── Git operations (clone/fetch/push over HTTPS) ──────────────────────
  - {script: scripts/git-fetch.sh,                             weight: 15}
  - {script: scripts/git-pull.sh,                              weight: 10}
  - {script: scripts/git-clone-repo.sh,                        weight: 10}
  - {script: scripts/git-clone-and-push.sh,                     weight: 5}
