# perf-workload-api.yaml — API-only workload (no git operations).
#
# Run build-all.sh first to create the org, repo, issues, and branches needed.

target_rpm: 60
duration: 300
workers: 5

scripts:
  # ── Read operations ────────────────────────────────────────────────────
  - {script: scripts/list-repo.sh,                          weight: 5}
  - {script: scripts/list-repository-issues.sh,              weight: 10}
  - {script: scripts/list-pull-requests.sh,                  weight: 10}
  - {script: scripts/list-org-repos.sh,                       weight: 5}
  - {script: scripts/get-repository-content.sh,              weight: 10}
  - {script: scripts/search-issues-and-pull-requests.sh,      weight: 5}

  # ── Write operations ───────────────────────────────────────────────────
  - {script: scripts/create-an-issue.sh,                     weight: 10}
  - {script: scripts/create-issue-comment.sh,                 weight: 10}
  - {script: scripts/create-branch-and-pr.sh,                 weight: 5}
